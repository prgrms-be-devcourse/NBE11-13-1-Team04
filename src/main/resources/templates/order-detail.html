<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Bean - 주문 상세</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/css/user-style.css">
</head>
<body>
<div class="user-layout">
    <header class="user-header">
        <div class="header-container">
            <a href="/" class="brand-logo">☕ Coffee Bean</a>
            <nav class="user-nav">
                <a href="/">상품 주문</a>
                <a href="/orders" class="active">주문 내역</a>
                <a href="/questions/new" >1:1 문의하기</a>
            </nav>
        </div>
    </header>

    <main class="user-main">
        <div class="page-header">
            <h2>📄 주문 상세 내역</h2>
            <p>선택하신 주문의 세부 정보를 확인합니다.</p>
        </div>

        <section class="user-card detail-card">
            <div class="detail-grid">
                <div class="detail-item">
                    <span class="label">주문 ID</span>
                    <span id="detailOrderId" class="value">-</span>
                </div>
                <div class="detail-item">
                    <span class="label">주문 코드</span>
                    <span id="detailOrderCode" class="value">-</span>
                </div>
                <div class="detail-item">
                    <span class="label">이메일</span>
                    <span id="detailEmail" class="value">-</span>
                </div>
                <div class="detail-item">
                    <span class="label">주문 상태</span>
                    <span id="detailStatus" class="value">-</span>
                </div>
                <div class="detail-item">
                    <span class="label">우편번호</span>
                    <span id="detailPostalCode" class="value">-</span>
                </div>
                <div class="detail-item">
                    <span class="label">주소</span>
                    <span id="detailAddress" class="value">-</span>
                </div>
                <div class="detail-item">
                    <span class="label">주문 일시</span>
                    <span id="detailOrderedAt" class="value">-</span>
                </div>
            </div>

            <hr class="divider">

            <h3 class="card-title">🛒 주문 상품 목록</h3>
            <table class="data-table">
                <thead>
                <tr>
                    <th>상품명</th>
                    <th>단가</th>
                    <th>수량</th>
                    <th>금액</th>
                </tr>
                </thead>
                <tbody id="orderItemsBody">
                <tr>
                    <td colspan="4" style="text-align:center;">불러오는 중...</td>
                </tr>
                </tbody>
            </table>

            <div class="cart-summary">
                <span>총 결제금액</span>
                <strong id="detailTotalPrice">0원</strong>
            </div>

            <hr class="divider">

            <div class="action-buttons">
                <button class="btn-outline" onclick="location.href='/orders'">목록으로 돌아가기</button>
                <button id="btnCancel" class="btn-danger" onclick="requestCancelOrder()">주문 취소 요청</button>
            </div>
        </section>
    </main>
</div>

<script src="/js/order-detail.js"></script>
</body>
</html>
