<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coffee Bean - 주문 내역</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="/css/user-style.css">
</head>
<body>
<div class="user-layout">
  <header class="user-header">
    <div class="header-container">
      <a href="/" class="brand-logo">☕ Coffee Bean</a>
      <nav class="user-nav">
        <a href="/">상품 주문</a>
        <a href="/orders" class="active">주문 내역</a>
        <a href="/questions/new">1:1 문의하기</a>
      </nav>
    </div>
  </header>

  <main class="user-main">
    <div class="page-header">
      <h2>🛍️ 내 주문 내역</h2>
      <p>주문 시 작성하셨던 이메일을 입력하시면 주문 내역을 확인하실 수 있습니다.</p>
    </div>

    <!-- 이메일 검색 카드 -->
    <section class="user-card">
      <form id="searchForm" class="filter-form" onsubmit="searchOrders(event)">
        <div class="filter-group flex-fill">
          <label for="searchEmail">이메일 확인 <span class="required">*</span></label>
          <input type="email" id="searchEmail" placeholder="주문 시 입력한 이메일을 입력하세요" required>
        </div>
        <div class="filter-buttons">
          <button type="submit" class="btn-primary">조회하기</button>
        </div>
      </form>
    </section>

    <!-- 주문 목록 테이블 카드 -->
    <section class="user-card">
      <table class="data-table">
        <thead>
        <tr>
          <th>주문 ID</th>
          <th>이메일</th>
          <th>주소</th>
          <th>주문 상태</th>
          <th>주문 일시</th>
          <th>상세 보기</th>
        </tr>
        </thead>
        <tbody id="orderListBody">
        <tr>
          <td colspan="6" style="text-align:center;">이메일을 입력 후 조회 버튼을 눌러주세요.</td>
        </tr>
        </tbody>
      </table>
    </section>
  </main>
</div>

<script src="/js/order-list.js"></script>
</body>
</html>
