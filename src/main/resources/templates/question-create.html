<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coffee Bean - 문의 작성</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="/css/user-style.css">
</head>
<body>
<div class="user-layout">
  <!-- Header -->
  <header class="user-header">
    <div class="header-container">
      <a href="/" class="brand-logo">☕ Coffee Bean</a>
      <nav class="user-nav">
        <a href="/orders/new">상품 주문</a>
        <a href="/orders">주문 내역</a>
        <a href="/questions/new" class="active">1:1 문의하기</a>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="user-main">
    <div class="page-header">
      <h2>💬 1:1 문의하기</h2>
      <p>궁금하신 점이나 불편한 사항을 남겨주시면 신속하게 답변드리겠습니다.</p>
    </div>

    <section class="user-card max-width-card">
      <form id="questionForm" onsubmit="handleCreateQuestion(event)">
        <div class="form-group">
          <label for="email">이메일 <span class="required">*</span></label>
          <input type="email" id="email" placeholder="example@email.com" required>
          <small class="form-help">작성하신 이메일은 문의 내역 조회 시 본인 확인용으로 사용됩니다.</small>
        </div>

        <div class="form-group">
          <label for="title">제목 <span class="required">*</span></label>
          <input type="text" id="title" placeholder="문의 제목을 입력해주세요" required>
        </div>

        <div class="form-group">
          <label for="content">문의 내용 <span class="required">*</span></label>
          <textarea id="content" rows="6" class="form-textarea" placeholder="문의하실 내용을 상세히 적어주세요" required></textarea>
        </div>

        <div class="button-group right-align">
          <button type="button" class="btn-outline" onclick="location.href='/questions'">내 문의 목록</button>
          <button type="submit" class="btn-primary">문의하기</button>
        </div>
      </form>
    </section>
  </main>
</div>

<script src="/js/question-create.js"></script>
</body>
</html>
