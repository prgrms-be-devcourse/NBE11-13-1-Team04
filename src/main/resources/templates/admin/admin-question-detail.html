<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coffee Bean Admin - 문의 상세 및 답변</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="/css/admin-style.css">
</head>
<body>
<div class="admin-layout">
  <aside class="admin-sidebar">
    <div class="sidebar-brand">☕ Coffee Bean Admin</div>
    <nav class="sidebar-nav">
      <a href="/admin/products">상품 관리</a>
      <a href="/admin/orders">주문 관리</a>
      <a href="/admin/sales">매출 및 통계</a>
      <a href="/admin/questions" class="active">1:1 문의 관리</a>
    </nav>
    <div class="sidebar-footer" style="padding: 20px;">
      <button class="btn-logout" onclick="logout()">로그아웃</button>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-header">
      <h2>📄 문의 상세 및 답변 작성</h2>
      <p>고객 문의 내용을 확인하고 답변을 등록하거나 수정합니다.</p>
    </div>

    <!-- 문의 상세 정보 -->
    <section class="admin-card">
      <div class="card-header-flex">
        <span id="questionStatus" class="badge">상태</span>
        <span id="questionCreatedAt" class="date-text">-</span>
      </div>

      <div class="detail-row">
        <span class="detail-label">작성자 이메일</span>
        <span id="questionEmail" class="detail-value-bold">-</span>
      </div>

      <div class="detail-row">
        <span class="detail-label">문의 제목</span>
        <h3 id="questionTitle" class="detail-title">-</h3>
      </div>

      <div class="detail-row">
        <span class="detail-label">문의 내용</span>
        <div id="questionContent" class="detail-content-box">-</div>
      </div>
    </section>

    <!-- 답변 등록 / 수정 폼 -->
    <section class="admin-card">
      <h3 class="card-title margin-bottom-16">☕ 관리자 답변 작성</h3>
      <form id="answerForm" onsubmit="handleSaveAnswer(event)">
        <div class="form-group">
          <label for="answerContent">답변 내용 <span class="required">*</span></label>
          <textarea id="answerContent" class="form-textarea" rows="6" placeholder="답변 내용을 입력해주세요." required></textarea>
        </div>

        <div class="button-group right-align">
          <button type="button" class="btn-outline" onclick="location.href='/admin/questions'">목록으로</button>
          <button type="submit" id="btnSubmitAnswer" class="btn-primary">답변 등록</button>
        </div>
      </form>
    </section>
  </main>
</div>

<script src="/js/admin-question-detail.js"></script>
</body>
</html>
