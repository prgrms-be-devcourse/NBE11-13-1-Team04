<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Bean Admin - 로그인</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/css/admin-style.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-card {
            width: 380px;
            background: #ffffff;
            border-radius: 8px;
            padding: 32px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>
<div class="login-card">
    <div style="text-align: center; margin-bottom: 24px;">
        <h1 style="font-size: 22px; color: #2c3e50; margin-bottom: 6px;">☕ Coffee Bean Admin</h1>
        <p style="font-size: 13px; color: #7f8c8d;">관리자 계정으로 로그인해주세요.</p>
    </div>

    <form id="loginForm">
        <div class="form-group">
            <label for="username" class="detail-label">아이디</label>
            <input id="username" type="text" class="form-select" style="width: 100%; padding: 10px;" placeholder="아이디를 입력하세요" required>
        </div>
        <div class="form-group" style="margin-bottom: 24px;">
            <label for="password" class="detail-label">비밀번호</label>
            <input id="password" type="password" class="form-select" style="width: 100%; padding: 10px;" placeholder="비밀번호를 입력하세요" required>
        </div>
        <button type="submit" class="btn-primary" style="width: 100%; padding: 12px;">로그인</button>
    </form>
    <p id="error" style="margin-top: 12px; color: #e53e3e; font-size: 13px; text-align: center;"></p>
</div>

<script src="/js/login.js"></script>
</body>
</html>
