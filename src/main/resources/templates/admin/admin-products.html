<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coffee Bean Admin - 상품 관리</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="/css/admin-style.css">
</head>
<body>
<div class="admin-layout">
  <!-- Admin Sidebar -->
  <aside class="admin-sidebar">
    <div class="sidebar-brand">☕ Coffee Bean Admin</div>
    <nav class="sidebar-nav">
      <a href="/admin/products" class="active">상품 관리</a>
      <a href="/admin/orders" >주문 관리</a>
      <a href="/admin/sales">매출 및 통계</a>
      <a href="/admin/questions">1:1 문의 관리</a>
    </nav>    <div class="sidebar-footer" style="padding: 20px;">
    <button class="btn-logout" onclick="logout()">로그아웃</button>
  </div>
  </aside>

  <!-- Main Content -->
  <main class="admin-main">
    <div class="admin-header">
      <div class="card-header-flex">
        <div>
          <h2>☕ 상품 관리</h2>
          <p>카페의 판매 상품을 등록, 수정, 카테고리별 조회 및 삭제할 수 있습니다.</p>
        </div>
        <button class="btn-primary" onclick="openCreateModal()">+ 새 상품 등록</button>
      </div>
    </div>

    <!-- 카테고리 필터 카드 -->
    <section class="admin-card">
      <form id="searchForm" class="filter-form-inline" onsubmit="searchProducts(event)" style="display: flex; gap: 12px; align-items: flex-end;">
        <div class="form-group" style="margin-bottom: 0; flex: 1;">
          <label for="categorySelect" class="detail-label">카테고리</label>
          <input type="text" id="categorySelect" class="form-select" style="width: 100%;" placeholder="예: 커피 원두, 음료, 디저트">
        </div>
        <div class="button-group">
          <button type="submit" class="btn-primary">조회</button>
          <button type="button" class="btn-outline" onclick="resetFilters()">초기화</button>
        </div>
      </form>
    </section>

    <!-- 상품 목록 테이블 카드 -->
    <section class="admin-card">
      <table class="admin-table">
        <thead>
        <tr>
          <th style="width: 60px;">ID</th>
          <th style="width: 80px;">이미지</th>
          <th>상품명</th>
          <th style="width: 120px;">카테고리</th>
          <th style="width: 110px;">가격</th>
          <th style="width: 90px;">재고 수량</th> <!-- 👈 추가된 헤더 -->
          <th style="width: 140px;">관리</th>
        </tr>
        </thead>
        <tbody id="productTableBody">
        <!-- JS 동적 렌더링 -->
        </tbody>
      </table>
    </section>
  </main>
</div>

<!-- 상품 등록 및 수정 모달 -->
<div id="productModal" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000;">
  <div class="admin-card" style="width: 480px; max-width: 90%; margin-bottom: 0;">
    <div class="card-header-flex">
      <h3 id="modalTitle" class="card-title">☕ 새 상품 등록</h3>
      <button type="button" class="btn-outline btn-sm" onclick="closeModal()">✕</button>
    </div>

    <form id="productForm" onsubmit="handleFormSubmit(event)" style="margin-top: 16px;">
      <input type="hidden" id="productId" name="id">

      <div class="form-group">
        <label for="productName" class="detail-label">상품명 <span style="color: #e53e3e;">*</span></label>
        <input type="text" id="productName" name="name" class="form-select" style="width: 100%;" maxlength="50" placeholder="예: 에티오피아 게이샤 100g" required>
      </div>

      <div class="form-group">
        <label for="productCategory" class="detail-label">카테고리 <span style="color: #e53e3e;">*</span></label>
        <input type="text" id="productCategory" name="category" class="form-select" style="width: 100%;" maxlength="50" placeholder="예: 커피 원두" required>
      </div>

      <!-- 👇 가격과 재고 수량을 한 줄에 배치 -->
      <div style="display: flex; gap: 12px;">
        <div class="form-group" style="flex: 1;">
          <label for="productPrice" class="detail-label">가격 (원) <span style="color: #e53e3e;">*</span></label>
          <input type="number" id="productPrice" name="price" class="form-select" style="width: 100%;" min="0" placeholder="40000" required>
        </div>
        <div class="form-group" style="flex: 1;">
          <label for="productStock" class="detail-label">재고 수량 <span style="color: #e53e3e;">*</span></label>
          <input type="number" id="productStock" name="stock" class="form-select" style="width: 100%;" min="0" placeholder="100" required>
        </div>
      </div>

      <div class="form-group">
        <label for="productImage" class="detail-label">상품 이미지 <span id="imageRequiredMark" style="color: #e53e3e;">*</span></label>
        <input type="file" id="productImage" class="form-select" style="width: 100%;" accept="image/*" onchange="previewImage(event)">
        <div id="imagePreviewContainer" style="display: none; margin-top: 8px; text-align: center; background: #f7fafc; border: 1px dashed #cbd5e0; padding: 10px; border-radius: 6px;">
          <img id="imagePreview" src="" alt="미리보기" style="max-width: 100%; max-height: 120px; object-fit: contain;">
        </div>
      </div>

      <div class="button-group right-align" style="margin-top: 24px;">
        <button type="button" class="btn-outline" onclick="closeModal()">취소</button>
        <button type="submit" id="btnSave" class="btn-primary">저장하기</button>
      </div>
    </form>
  </div>
</div>

<script src="/js/admin-products.js"></script>
</body>
</html>
