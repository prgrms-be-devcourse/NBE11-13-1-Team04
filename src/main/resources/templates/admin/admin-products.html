<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Coffee Bean Admin - 상품 관리</title>
  <link rel="stylesheet" href="/css/admin-products.css">
</head>
<body>
<div class="admin-container">
  <!-- 사이드바 -->
  <aside class="sidebar">
    <div class="logo">
      <h2>☕ Coffee Bean</h2>
      <span>Admin System</span>
    </div>
    <nav class="menu-list">
      <a href="/admin/orders">🛍️ 주문 관리</a>
      <a href="/admin/products" class="active">☕ 상품 관리</a>
      <a href="#" onclick="alert('준비 중인 기능입니다.')">📊 매출 통계</a>
    </nav>
    <div class="sidebar-footer">
      <button class="btn-logout" onclick="logout()">🔓 로그아웃</button>
    </div>
  </aside>

  <!-- 메인 콘텐츠 영역 -->
  <main class="main-content">
    <header class="content-header header-flex">
      <div>
        <h1>☕ 상품 관리</h1>
        <p>카페의 판매 상품을 등록, 수정, 카테고리별 조회 및 삭제할 수 있습니다.</p>
      </div>
      <button class="btn-primary" onclick="openCreateModal()">+ 새 상품 등록</button>
    </header>

    <section class="content-body">
      <!-- 카테고리 필터 카드 -->
      <div class="admin-card">
        <form id="searchForm" class="filter-form" onsubmit="searchProducts(event)">
          <div class="filter-group">
            <label for="categorySelect">카테고리</label>
            <input type="text" id="categorySelect" placeholder="예: 커피 원두, 음료, 디저트">
          </div>
          <div class="filter-buttons">
            <button type="submit" class="btn-primary">조회</button>
            <button type="button" class="btn-outline" onclick="resetFilters()">초기화</button>
          </div>
        </form>
      </div>

      <!-- 상품 목록 테이블 카드 -->
      <div class="admin-card">
        <table class="menu-table">
          <thead>
          <tr>
            <th>ID</th>
            <th>이미지</th>
            <th>상품명</th>
            <th>카테고리</th>
            <th>가격</th>
            <th>관리</th>
          </tr>
          </thead>
          <tbody id="productTableBody">
          <!-- JS 동적 렌더링 -->
          </tbody>
        </table>
      </div>
    </section>
  </main>
</div>

<!-- ==========================================================================
   상품 등록 및 수정 모달 (Multipart Form)
   ========================================================================== -->
<div id="productModal" class="modal-overlay">
  <div class="modal-card">
    <div class="modal-header">
      <h3 id="modalTitle" class="card-title">☕ 새 상품 등록</h3>
      <button class="btn-close" onclick="closeModal()">&times;</button>
    </div>
    <hr class="divider">
    <form id="productForm" onsubmit="handleFormSubmit(event)">
      <input type="hidden" id="productId" name="id">

      <div class="form-group">
        <label for="productName">상품명 <span class="required">*</span></label>
        <input type="text" id="productName" name="name" maxlength="50" placeholder="예: 에티오피아 게이샤 100g" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="productCategory">카테고리 <span class="required">*</span></label>
          <input type="text" id="productCategory" name="category" maxlength="50" placeholder="예: 커피 원두" required>
        </div>
        <div class="form-group">
          <label for="productPrice">가격 (원) <span class="required">*</span></label>
          <input type="number" id="productPrice" name="price" min="0" placeholder="40000" required>
        </div>
      </div>

      <div class="form-group">
        <label for="productImage">상품 이미지 <span id="imageRequiredMark" class="required">*</span></label>
        <input type="file" id="productImage" accept="image/*" onchange="previewImage(event)">
        <div id="imagePreviewContainer" class="image-preview-box" style="display: none;">
          <img id="imagePreview" src="" alt="미리보기">
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn-outline" onclick="closeModal()">취소</button>
        <button type="submit" class="btn-primary" id="btnSave">저장하기</button>
      </div>
    </form>
  </div>
</div>

<script src="/js/admin-products.js"></script>
</body>
</html>
