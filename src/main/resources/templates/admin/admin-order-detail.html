<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Bean Admin - 주문 상세</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/css/admin-style.css">
</head>
<body>
<div class="admin-layout">
    <!-- Admin Sidebar -->
    <aside class="admin-sidebar">
        <div class="sidebar-brand">☕ Coffee Bean Admin</div>
        <nav class="sidebar-nav">
            <a href="/admin/products">상품 관리</a>
            <a href="/admin/orders" class="active">주문 관리</a>
            <a href="/admin/questions">1:1 문의 관리</a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="admin-main">
        <div class="admin-header">
            <div class="card-header-flex">
                <div>
                    <h2>🛍️ 주문 상세 정보</h2>
                    <p>주문자의 상세 정보와 주문 상품 내역을 확인합니다.</p>
                </div>
                <button class="btn-outline" onclick="location.href='/admin/orders'">← 목록으로 돌아가기</button>
            </div>
        </div>

        <!-- 주문 기본 정보 카드 -->
        <section class="admin-card">
            <h3 class="card-title margin-bottom-16">주문 정보</h3>
            <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px;">
                <div class="detail-row" style="margin-bottom: 0;">
                    <span class="detail-label">주문 번호</span>
                    <span id="detailOrderCode" class="detail-value-bold">-</span>
                </div>
                <div class="detail-row" style="margin-bottom: 0;">
                    <span class="detail-label">주문 일시</span>
                    <span id="detailOrderedAt" class="detail-value-bold">-</span>
                </div>
                <div class="detail-row" style="margin-bottom: 0;">
                    <span class="detail-label">주문 상태</span>
                    <span id="detailStatus" class="badge">-</span>
                </div>
                <div class="detail-row" style="margin-bottom: 0;">
                    <span class="detail-label">주문자 이메일</span>
                    <span id="detailEmail" class="detail-value-bold">-</span>
                </div>
                <div class="detail-row" style="margin-bottom: 0;">
                    <span class="detail-label">배송지 주소</span>
                    <span id="detailAddress" class="detail-value-bold">-</span>
                </div>
                <div class="detail-row" style="margin-bottom: 0;">
                    <span class="detail-label">우편번호</span>
                    <span id="detailPostalCode" class="detail-value-bold">-</span>
                </div>
            </div>
        </section>

        <!-- 주문 상품 내역 카드 -->
        <section class="admin-card">
            <h3 class="card-title margin-bottom-16">주문 상품 내역</h3>
            <table class="admin-table">
                <thead>
                <tr>
                    <th>상품 ID</th>
                    <th>상품명</th>
                    <th>단가</th>
                    <th>수량</th>
                    <th>소계</th>
                </tr>
                </thead>
                <tbody id="detailItemTableBody">
                <!-- JS 동적 렌더링 -->
                </tbody>
            </table>

            <div style="text-align: right; margin-top: 20px; font-size: 16px; font-weight: bold; color: #2c3e50;">
                총 결제 금액: <span id="detailTotalPrice" style="color: #6f4e37;">0</span>원
            </div>

            <div id="actionButtonContainer" class="button-group right-align" style="margin-top: 16px;"></div>
        </section>
    </main>
</div>

<script src="/js/admin-order-detail.js"></script>
</body>
</html>
