<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Bean Admin - 주문 관리</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/css/admin-style.css">
</head>
<body>
<div class="admin-layout">
    <!-- Admin Sidebar -->
    <aside class="admin-sidebar">
        <div class="sidebar-brand">☕ Coffee Bean Admin</div>
        <nav class="sidebar-nav">
            <a href="/admin/products">상품 관리</a>
            <a href="/admin/orders" class="active">주문 관리</a>
            <a href="/admin/sales">매출 및 통계</a>
            <a href="/admin/questions">1:1 문의 관리</a>
        </nav>    <div class="sidebar-footer" style="padding: 20px;">
        <button class="btn-logout" onclick="logout()">로그아웃</button>
    </div>
    </aside>

    <!-- Main Content -->
    <main class="admin-main">
        <div class="admin-header">
            <h2>🛍️ 주문 관리</h2>
            <p>고객의 주문 목록 조회, 기간 및 상태 검색, 상세 조회를 관리합니다.</p>
        </div>

        <section class="admin-card">
            <form id="searchForm" onsubmit="searchOrders(event)" style="display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap;">
                <div class="form-group" style="margin-bottom: 0;">
                    <label for="statusSelect" class="detail-label">주문 상태</label>
                    <select id="statusSelect" name="status" class="form-select">
                        <option value="">전체 상태</option>
                        <option value="ORDERED">미확정 (ORDERED)</option>
                        <option value="CONFIRMED">주문 확정 (CONFIRMED)</option>
                        <option value="CANCEL_REQUESTED">취소 요청 (CANCEL_REQUESTED)</option>
                        <option value="CANCELED">취소 완료 (CANCELED)</option>
                    </select>
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label for="startDate" class="detail-label">시작일</label>
                    <input type="date" id="startDate" name="startDate" class="form-select">
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label for="endDate" class="detail-label">종료일</label>
                    <input type="date" id="endDate" name="endDate" class="form-select">
                </div>
                <div class="button-group">
                    <button type="submit" class="btn-primary">조회</button>
                    <button type="button" class="btn-outline" onclick="resetFilters()">초기화</button>
                </div>
            </form>
        </section>

        <section class="admin-card">
            <table class="admin-table">
                <thead>
                <tr>
                    <th>주문번호</th>
                    <th>이메일</th>
                    <th>총 수량</th>
                    <th>총 결제금액</th>
                    <th>주문일시</th>
                    <th>확정일시</th>
                    <th>상태</th>
                    <th>관리</th>
                </tr>
                </thead>
                <tbody id="orderTableBody">
                <!-- JS dynamic render -->
                </tbody>
            </table>
        </section>
    </main>
</div>

<script src="/js/admin-orders.js"></script>
</body>
</html>
