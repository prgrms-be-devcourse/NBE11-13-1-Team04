<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Bean - 문의 상세</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/css/user-style.css">
</head>
<body>
<div class="user-layout">
    <header class="user-header">
        <div class="header-container">
            <a href="/" class="brand-logo">☕ Coffee Bean</a>
            <nav class="user-nav">
                <a href="/">상품 주문</a>
                <a href="/orders">주문 내역</a>
                <a href="/questions" class="active">1:1 문의하기</a>
            </nav>
        </div>
    </header>

    <main class="user-main">
        <div class="page-header">
            <h2>📄 문의 상세 내역</h2>
            <p>등록하신 문의 내용과 답변을 확인합니다.</p>
        </div>

        <!-- 문의 상세 정보 -->
        <section class="user-card">
            <div class="card-header-flex">
                <span id="questionStatus" class="badge">상태</span>
                <span id="questionCreatedAt" class="date-text">-</span>
            </div>

            <div class="detail-row">
                <span class="detail-label">문의 제목</span>
                <h3 id="questionTitle" class="detail-title">-</h3>
            </div>

            <div class="detail-row">
                <span class="detail-label">문의 내용</span>
                <div id="questionContent" class="detail-content-box">-</div>
            </div>
        </section>

        <!-- 답변 영역 -->
        <section id="answerContainer" class="user-card" style="display: none;">
            <h3 class="card-title margin-bottom-16">☕ 관리자 답변</h3>
            <div id="answerContent" class="detail-content-box">-</div>
            <div class="date-text text-right margin-top-8" id="answerCreatedAt">-</div>
        </section>

        <!-- 버튼 영역 -->
        <div class="button-group right-align margin-top-16">
            <button type="button" class="btn-outline" onclick="goBackToList()">목록으로</button>
            <!-- ★ 삭제 버튼 추가 -->
            <button type="button" class="btn-danger" id="deleteBtn" onclick="handleDeleteQuestion()">삭제하기</button>
        </div>
    </main>
</div>

<script src="/js/question-detail.js"></script>
</body>
</html>
